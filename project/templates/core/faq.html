{% load static %}

<head>
    <script src="https://cdn.tailwindcss.com"></script>

    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>


<section class="bg-slate-50 dark:bg-slate-900 py-16 sm:py-24">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div class="mx-auto max-w-3xl text-center">
            <h2 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white sm:text-4xl">
                Answers to Your Questions
            </h2>
            <p class="mt-4 text-lg leading-8 text-gray-600 dark:text-gray-400">
                Find answers to common questions about our services, policies, and platform features.
            </p>
        </div>

        <div x-data="{ openFaq: null }" class="mt-16 max-w-4xl mx-auto flex flex-col gap-y-6">

            {% for faq in faqs %}
                <div x-data="{ faqId: {{ forloop.counter }} }"
                     class="bg-white dark:bg-slate-800 rounded-xl shadow-sm ring-1 ring-gray-900/5 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg">

                    <button @click="openFaq = (openFaq === faqId) ? null : faqId"
                            class="flex w-full items-start justify-between p-6 text-left">

                        <span class="flex items-start">
<!--                            <span class="mr-4 h-7 w-7 flex-shrink-0 items-center justify-center rounded-full bg-blue-100 dark:bg-blue-900/50 text-blue-600 dark:text-blue-300 font-semibold">-->
<!--                              {{ forloop.counter }}-->
<!--                            </span>-->

                            <span class="text-lg font-semibold text-gray-800 dark:text-gray-100"
                                  :class="{ '!text-blue-600 dark:!text-blue-400': openFaq === faqId }">
                                {{ faq.question }}
                            </span>
                        </span>

                        <span class="ml-4 flex h-7 w-7 flex-shrink-0 items-center justify-center">
                            <svg class="h-6 w-6 text-gray-500" :class="{ 'text-blue-600': openFaq === faqId }" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                              <path x-show="openFaq === faqId" x-cloak stroke-linecap="round" stroke-linejoin="round" d="M18 12H6" />
                              <path x-show="openFaq !== faqId" stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6" />
                            </svg>
                        </span>
                    </button>

                    <div x-show="openFaq === faqId" x-collapse x-cloak>
                        <div class="px-6 pb-6 pt-4 border-t border-gray-200 dark:border-slate-700">
                            <p class="text-base leading-7 text-gray-700 dark:text-gray-300">
                                {{ faq.answer|linebreaksbr }}
                            </p>
                        </div>
                    </div>
                </div>
            {% endfor %}

        </div>
    </div>
</section>
