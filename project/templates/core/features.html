

<!-- Font Awesome for icons (if not already in your base template) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Tailwind CSS (if not already in your base template) -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
    /* Custom styles for the eye-catching feature cards */
    .feature-card {
        background-color: white;
        border-radius: 1rem; /* lg */
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
        transition: all 0.3s ease-in-out;
        overflow: hidden; /* Ensures the image corners are rounded */
        border: 1px solid #f3f4f6; /* Gray-100 */
    }
    .feature-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
    .feature-card-image-wrapper {
        position: relative;
    }
    .feature-card-image {
        width: 100%;
        height: 14rem; /* 224px */
        object-fit: cover;
    }
</style>

<!-- "Why Book With Us?" Section -->
<section class="py-20 bg-gray-50">
    <div class="container mx-auto px-4">
        <!-- Section Header -->
        <div class="text-center mb-12">
            <h2 class="text-4xl font-extrabold text-gray-800 tracking-tight">Why book your transfers with us?</h2>
            <p class="mt-4 text-lg text-gray-600 max-w-3xl mx-auto">Book your transfers with us for a stress-free travel experience and top-notch service.</p>
        </div>

        <!-- Features Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto">

            {% for feature in features %}
            <div class="feature-card">
                <div class="feature-card-image-wrapper">
                    <!-- Ensure your feature.image field has a valid image uploaded -->
                    <img class="feature-card-image" src="{{ feature.image.url }}" alt="{{ feature.name }}">
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-bold text-gray-900">{{ feature.name }}</h3>
                    <p class="mt-3 text-gray-600">
                        {{ feature.description }}
                    </p>
                </div>
            </div>
            {% endfor %}

        </div>
    </div>
</section>
